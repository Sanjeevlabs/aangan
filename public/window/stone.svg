<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Kota-style limestone slabs, procedurally: grey-green stone with slow
       clouding, fine pale veins, honed and a little worn; thin joints.
       Made for Aangan; no third-party image. -->
  <defs>
    <filter id="s" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="21" stitchTiles="stitch" result="cloud"/>
      <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.24  0 0 0 0 0.22  1.4 0 0 0 -0.55" result="dark"/>
      <feTurbulence type="turbulence" baseFrequency="0.02 0.08" numOctaves="2" seed="5" stitchTiles="stitch" result="v"/>
      <feColorMatrix in="v" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.8  0 0 0 0 0.76  -4 0 0 0 0.3" result="veins"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="2" stitchTiles="stitch" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.13  0 0 0 0 0.12  2 0 0 0 -1.3" result="grain"/>
      <feComposite in="dark" in2="SourceGraphic" operator="over" result="a"/>
      <feComposite in="veins" in2="a" operator="over" result="b"/>
      <feComposite in="grain" in2="b" operator="over" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#4b524c"/>
  <g filter="url(#s)">
    <rect x="0.8" y="0.8" width="158" height="118" fill="#8d968c"/>
    <rect x="160.8" y="0.8" width="78.4" height="118" fill="#848e86"/>
    <rect x="0.8" y="120.8" width="78" height="118.4" fill="#87908a"/>
    <rect x="80.8" y="120.8" width="158.4" height="118.4" fill="#919a8f"/>
  </g>
</svg>
